[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "facebook-playwright-mcp"
version = "0.1.0"
description = "MCP server for personal Facebook automation using Playwright"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.0.0",
    "playwright>=1.40.0"
]

[project.scripts]
facebook-mcp = "facebook_mcp.server:main"
facebook-mcp-login = "facebook_mcp.login:interactive_login"

[tool.setuptools.packages.find]
where = ["src"]
